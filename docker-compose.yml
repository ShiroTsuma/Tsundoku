services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    depends_on:
      otel-collector:
        condition: service_started
      crawler:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5232
      ConnectionStrings__DB: ${DB_CONNECTION_STRING}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-}
      Database__AutoMigrate: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Admin__Emails__0: ${ADMIN_EMAIL}
      RateLimiting__LoginIp__PermitLimit: ${RATE_LIMITING_LOGIN_IP_PERMIT_LIMIT:-20}
      RateLimiting__LoginIp__WindowSeconds: ${RATE_LIMITING_LOGIN_IP_WINDOW_SECONDS:-60}
      RateLimiting__LoginAccount__PermitLimit: ${RATE_LIMITING_LOGIN_ACCOUNT_PERMIT_LIMIT:-5}
      RateLimiting__LoginAccount__WindowSeconds: ${RATE_LIMITING_LOGIN_ACCOUNT_WINDOW_SECONDS:-300}
      Authentication__MinimumFailureResponseMilliseconds: ${AUTH_MINIMUM_FAILURE_RESPONSE_MILLISECONDS:-250}
      RateLimiting__Expensive__PermitLimit: ${RATE_LIMITING_EXPENSIVE_PERMIT_LIMIT:-40}
      RateLimiting__Expensive__WindowSeconds: ${RATE_LIMITING_EXPENSIVE_WINDOW_SECONDS:-60}
      RateLimiting__FullBackup__WindowMinutes: ${RATE_LIMITING_FULL_BACKUP_WINDOW_MINUTES:-20}
      Cors__AllowedOrigins__0: ${WEB_PUBLIC_ORIGIN:-https://localhost:8080}
      Cors__AllowedOrigins__1: https://localhost:${WEB_PORT:-8080}
      Cors__AllowedOrigins__2: http://localhost:${WEB_HTTP_PORT:-8081}
      Cors__AllowedOrigins__3: http://localhost:5173
      BookCovers__S3__Endpoint: ${BOOK_COVERS__S3__ENDPOINT:-}
      BookCovers__S3__Region: ${BOOK_COVERS__S3__REGION:-}
      BookCovers__S3__AccessKey: ${BOOK_COVERS__S3__ACCESS_KEY:-}
      BookCovers__S3__SecretKey: ${BOOK_COVERS__S3__SECRET_KEY:-}
      BookCovers__S3__Bucket: ${BOOK_COVERS__S3__BUCKET:-}
      BookFiles__MaxOwnerStorageBytes: ${BOOK_FILES_OWNER_STORAGE_BYTES:-10737418240}
      BookFiles__MaxLibraryArchiveBytes: ${BOOK_FILES_LIBRARY_ARCHIVE_BYTES:-12884901888}
      BookFiles__MaxStagingBytes: ${BOOK_FILES_STAGING_BYTES:-25769803776}
      Crawler__Enabled: ${CRAWLER_ENABLED:-true}
      Crawler__RunJobs: ${CRAWLER_RUN_JOBS:-true}
      Crawler__BaseUrl: http://crawler:8181
      Crawler__ApiKey: ${CRAWLER_API_KEY:?Set CRAWLER_API_KEY to a random secret of at least 32 characters}
      OTEL_SERVICE_NAME: tsundoku-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - ./storage/covers:/app/storage/covers
      - ./storage/epubs:/app/storage/epubs
      - ./storage/epub-staging:/app/storage/epub-staging
    restart: unless-stopped
    networks:
      - default
      - crawler-internal
    ports:
      - "127.0.0.1:${API_PORT:-5232}:5232"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5232/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  crawler:
    image: tsundoku-crawler:4.14.0
    build:
      context: ./tools/lncrawl
    environment:
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:?Set CRAWLER_API_KEY to a random secret of at least 32 characters}
      LNCRAWL_DATA_PATH: /data
      CRAWLER_RUN_JOBS: ${CRAWLER_RUN_JOBS:-true}
      CRAWLER_VERIFICATION_PAUSE_SECONDS: ${CRAWLER_VERIFICATION_PAUSE_SECONDS:-900}
      TZ: Europe/Warsaw
      HTTP_PROXY: http://crawler-egress:3128
      HTTPS_PROXY: http://crawler-egress:3128
      http_proxy: http://crawler-egress:3128
      https_proxy: http://crawler-egress:3128
      NO_PROXY: localhost,127.0.0.1
      PROXY_URLS: http://crawler-egress:3128
    volumes:
      - crawler-data:/data
    networks:
      - crawler-internal
    depends_on:
      crawler-egress:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:${CRAWLER_NO_NEW_PRIVILEGES:-true}
    cap_drop: [ALL]

  crawler-egress:
    image: tsundoku-crawler:4.14.0
    pull_policy: never
    environment:
      CRAWLER_RUN_JOBS: ${CRAWLER_RUN_JOBS:-true}
    command: [python, /app/egress.py]
    volumes:
      - crawler-data:/data:ro
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 3128), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - crawler-internal
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:${CRAWLER_NO_NEW_PRIVILEGES:-true}
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_DOMAIN|PUBLIC_HTTPS_AUTHORITY|BOOK_FILES_ARCHIVE_UPLOAD_LIMIT
      BOOK_FILES_ARCHIVE_UPLOAD_LIMIT: ${BOOK_FILES_ARCHIVE_UPLOAD_LIMIT:-12289m}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PUBLIC_HTTPS_AUTHORITY: ${PUBLIC_HTTPS_AUTHORITY:-localhost:8080}
      ACME_ENABLED: ${ACME_ENABLED:-false}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - web-cert-data:/etc/nginx/certs
      - letsencrypt-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped
    ports:
      - target: 443
        published: "${WEB_PORT:-8080}"
        protocol: tcp
        mode: host
      - target: 80
        published: "${WEB_HTTP_PORT:-8081}"
        protocol: tcp
        mode: host

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  crawler-data:
  web-cert-data:
  letsencrypt-data:
  certbot-webroot:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  crawler-internal:
    internal: true
